<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Web Push 購読テスト</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 16px; line-height: 1.6; }
  button { font-size: 16px; padding: 10px 14px; margin: 6px 0; }
  textarea, input { width: 100%; box-sizing: border-box; font-size: 14px; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f2f2f2; padding: 8px; }
</style>
</head>
<body>
<h1>Web Push 購読テスト</h1>
<p>たくまくんアプリとは無関係の、検証専用ページです。</p>
<ol>
  <li>ホーム画面に追加して、ホーム画面のアイコンから開く</li>
  <li>GASで表示した VAPID 公開鍵を下に貼り付ける</li>
  <li>「通知を許可して購読」を押す</li>
  <li>表示されたJSONをコピーして、GASの TEST_SUBSCRIPTION に保存する</li>
</ol>
<p>状態: <span id="status">-</span></p>
<label>VAPID公開鍵（applicationServerKey）<input id="vapid" autocomplete="off"></label>
<button id="go">通知を許可して購読</button>
<textarea id="out" rows="8" readonly></textarea>
<button id="copy">購読JSONをコピー</button>
<pre id="log"></pre>
<script>
const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent += m + '\n'; };
const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
$('status').textContent = 'standalone=' + standalone + ' / Notification=' + (window.Notification ? Notification.permission : '非対応') + ' / PushManager=' + ('PushManager' in window);
function toKey(b64u) {
  const s = b64u.replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(s + '='.repeat((4 - (s.length % 4)) % 4));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}
$('go').addEventListener('click', async () => {
  try {
    const key = $('vapid').value.trim();
    if (!key) throw new Error('VAPID公開鍵を入力してください');
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    log('permission=' + perm);
    if (perm !== 'granted') return;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: toKey(key) });
    $('out').value = JSON.stringify(sub.toJSON());
    log('subscribed. endpoint host=' + new URL(sub.endpoint).host);
  } catch (e) { log('ERROR: ' + e); }
});
document.getElementById("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("out").value); log("コピーしました"); }
  catch (e) { $("out").select(); log("自動コピーできません。テキストを長押ししてコピーしてください"); }
});
</script>
</body>
</html>
